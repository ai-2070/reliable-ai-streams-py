name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Note: 3.14 excluded until grpcio wheels are available (slow build from source)
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest --tb=short --ignore=tests/integration

  openai-majors:
    name: openai ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "2.x"
            spec: "openai>=2,<3"
          - label: "3.x"
            spec: "openai>=3,<4"

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # The litellm extra is omitted: current litellm releases cap openai<3,
      # so it cannot be co-installed with the 3.x leg.
      - name: Install dependencies
        run: uv sync --extra openai

      - name: Pin openai to ${{ matrix.label }}
        run: uv pip install "${{ matrix.spec }}"

      - name: Run tests
        run: uv run --no-sync pytest --tb=short --ignore=tests/integration
